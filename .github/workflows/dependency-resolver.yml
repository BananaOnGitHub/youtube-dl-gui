name: Dependency resolver
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo test --locked --manifest-path tests/dependency-resolver/Cargo.toml
      - run: cargo clippy --locked --manifest-path tests/dependency-resolver/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path tests/dependency-resolver/Cargo.toml --all -- --check
